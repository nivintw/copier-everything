# Dead-link check for this template repo's own Markdown (README, docs). Mirrors the
# link-check.yml.jinja shipped into generated repos — link checking is a network operation, so
# it's its own workflow, separate from the deterministic render-matrix gate in ci.yml.

name: link-check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: link-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check links (lychee)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # lychee excludes mailto: by default; scope to Markdown so LICENSES/lockfiles aren't
          # crawled. Excludes — our Pages site and our own /compare/ URLs (valid but
          # unverifiable from a PR) and the REUSE badge /info/ endpoint — live in
          # .config/lychee.toml, passed via --config so all excludes share one source. See
          # that file for the per-host rationale.
          args: "--no-progress --config .config/lychee.toml '**/*.md'"
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
